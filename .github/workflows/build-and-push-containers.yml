name: Build and Push Containers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: frontend
            context: ./scikidzapp/scikidz-frontend
            dockerfile: ./scikidzapp/scikidz-frontend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/scikidz-frontend
          - name: backend
            context: ./scikidzapp/backend
            dockerfile: ./scikidzapp/backend/dockerfile
            image: ghcr.io/${{ github.repository_owner }}/scikidz-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
