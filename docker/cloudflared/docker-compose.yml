services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    secrets:
      - tunnel-token
    # configs:
    #   - source: cloudflared_config
    #     target: /etc/cloudflared/config.yml
    #     mode: 400
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/tunnel-token
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
secrets:
  tunnel-token:
    file: ./secrets/tunnel-token.txt

