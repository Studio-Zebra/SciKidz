services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    secrets:
      - tunnel-token
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel-token
    networks:
      - proxy
    deploy:
      restart_policy:
        condition: on-failure
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
secrets:
  tunnel-token:
    file: ./secrets/tunnel-token
networks:
  proxy:
    external: true
