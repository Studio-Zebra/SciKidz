services:
  # Mongodb
  mongo:
    image: mongo:7.0
    configs:
      - source: mongo_init
        target: /docker-entrypoint-initdb.d/init.js
        mode: 444
    secrets:
      - mongo-root-password
      - mongo-database-password
    volumes:
      - mongodb-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo-root-password
      MONGO_INITDB_DATABASE: scikidz
      MONGO_INITDB_DATABASE_USERNAME: scikidz_service
      MONGO_INITDB_DATABASE_PASSWORD_FILE: /run/secrets/mongo-database-password
    networks:
      - mongo
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
  mongo-express:
    image: mongo-express
    entrypoint: ["/bin/sh", "/configs/entrypoint.sh"]
    configs:
      - source: mongo-express-entrypoint
        target: /configs/entrypoint.sh
        mode: 755
    secrets:
      - mongo-root-password
      - mongo-express-password
    environment:
      ME_CONFIG_SITE_BASEURL: /db
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD_FILE: /run/secrets/mongo-root-password
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      MONGO_EXPRESS_PASSWORD_FILE: /run/secrets/mongo-express-password
    networks:
      - mongo
      - proxy
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
  # Scikidz
  backend:
    image: scikidz-backend:latest
    build:
      context: ../../scikidzapp/backend
      dockerfile: dockerfile
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://scikidz_service:PASSWORD@mongo:27017/scikidz?authSource=admin
      - MONGO_PASSWORD_FILE=/run/secrets/mongo-database-password
      - PORT=5757
    networks:
      - scikidz
      - mongo
    secrets:
      - mongo-database-password
  # Cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    secrets:
      - tunnel-token
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel-token
    networks:
      - proxy
    deploy:
      restart_policy:
        condition: on-failure
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
configs:
  mongo_init:
    file: ./configs/mongo/init.js
  mongo-express-entrypoint:
    file: ./configs/mongo-express/entrypoint.sh
secrets:
  mongo-root-password:
    file: ./secrets/mongo-root-password
    name: mongo-root-password
  mongo-database-password:
    file: ./secrets/mongo-database-password
    name: mongo-database-password
  mongo-express-password:
    file: ./secrets/mongo-express-password
    name: mongo-express-password
  tunnel-token:
    file: ./secrets/tunnel-token
    name: tunnel-token
volumes:
  mongodb-data:
networks:
  mongo:
    driver: overlay
    attachable: true
  scikidz:
    driver: overlay
    attachable: true
  proxy:
    external: true
