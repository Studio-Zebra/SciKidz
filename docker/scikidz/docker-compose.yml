services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    secrets:
      - cloudflared_token
    configs:
      - source: cloudflared_config
        target: /etc/cloudflared/config.yml
        mode: 400
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/cloudflared_token
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
secrets:
  cloudflared_token:
    file: ./token.txt
configs:
  # Cloudflared
  cloudflared_config:
    file: ./cloudflared/config.yml
