- name: Download Tailscale install script
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/install_tailscale.sh
    mode: "0755"
- name: Run Tailscale install script
  ansible.builtin.command: /tmp/install_tailscale.sh
  args:
    creates: /usr/bin/tailscale
- name: Enable and start Tailscale service
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true
- name: Check Tailscale status
  ansible.builtin.command: tailscale status
  register: tailscale_status
  changed_when: false
  failed_when: false
- name: Connect to Tailscale network
  ansible.builtin.command: "tailscale up --authkey={{ tailscale_auth_key }}"
  when: tailscale_status.rc != 0 or 'Logged out' in tailscale_status.stdout
  changed_when: true
# OpenSSH Setup and Security Requirements
- name: Ensure drop-in directory for sshd_config exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: "0755"
- name: Configure OpenSSH proper security (Tailscale Only)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-tailscale.conf
    content: |
      # 1. Disable Password Authentication
      PasswordAuthentication no

      # 2. Disable Root Login
      PermitRootLogin no

      # 3. Disable X11 Forwarding
      X11Forwarding no

      # 4. Only allow connections from Tailscale's CGNAT range & localhost
      Match Address *,!100.64.0.0/10,!fd7a:115c:a1e0::/48,!127.0.0.0/8,!::1
          DenyUsers *
          MaxAuthTries 0
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH
